name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/integration.yml

  deploy:
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Load env
        run: cp /opt/crawlspace/.env .env
      - name: Deploy
        run: docker compose -p crawlspace-forum up -d --build
      - name: Restart nginx
        run: docker compose -p crawlspace-forum up -d --force-recreate nginx
      - name: Smoke test API
        run: curl -f --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8080/api/health
      - name: Smoke test frontend
        run: curl -f --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8080/
      - name: Cleanup
        run: docker image prune -f